services:
  # FastAPI backend
  - type: web
    name: gitrep-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      # The deployed frontend URL
      - key: ALLOWED_ORIGINS
        value: https://git-rep.onrender.com

  # React frontend (static site)
  - type: web
    name: git-rep
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set this to your deployed backend URL after the first deploy
      - key: VITE_API_URL
        value: https://gitrep-api.onrender.com
